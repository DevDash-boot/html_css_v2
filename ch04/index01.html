<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Brew & Bean</h1>
      <p>당신의 하루를 깨우는 한 잔</p>
    </header>
    <main>
      <div class="menu-grid">
        <div class="card">
          <img src="http://picsum.photos/id/60/300/200" alt="커피 이미지" />
          <div class="card-body">
            <h3 class="menu-name">아메리카노</h3>
            <p class="menu-desc">깔끔하고 진한 에스프레소</p>
            <span class="price">4500원</span>
          </div>
        </div>
        <div class="card">
          <img src="http://picsum.photos/id/61/300/200" alt="커피 이미지" />
          <div class="card-body">
            <h3 class="menu-name">카페라떼</h3>
            <p class="menu-desc">부드러운 우유 거품이 가득</p>
            <span class="price">5000원</span>
          </div>
        </div>
        <div class="card">
          <img src="http://picsum.photos/id/62/300/200" alt="커피 이미지" />
          <div class="card-body">
            <h3 class="menu-name">바닐라 라떼</h3>
            <p class="menu-desc">달콤한 바닐라 시럽 한 스푼</p>
            <span class="price">5500원</span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
