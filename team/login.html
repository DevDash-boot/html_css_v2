<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <section class="login">
      <div class="top">
        <h2>로그인</h2>
        <p class="close">×</p>
      </div>
      <main>
        <div class="loginL">
          <input class="id" type="text" placeholder="아이디" />
          <input class="pw" type="password" placeholder="비밀번호" />
          <div class="checkbox-phone">
            <div class="checkbox">
              <input type="checkbox" class="cb" />
              <span>아이디 저장</span>
            </div>
            <div class="phone">
              <a href="https://www.sepay.org/spm/join?regSiteCode=XF&ctgCode=1&subCode=1">
                <p class="phonelogin">휴대폰 간편 로그인</p>
                <p class="ad">간편결제매니저유료서비스광고AD</p>
              </a>
            </div>
          </div>
          <a href="#" class="btn-login">로그인</a>
          <div class="nav">
            <a href="">ID/PW 찾기</a>
            <span>│</span>
            <a href="">회원가입</a>
            <span>│</span>
            <a href="">비회원 예매확인</a>
          </div>
          <div class="outer">
            <a
              href="https://nid.naver.com/oauth2.0/authorize?response_type=code&client_id=5UIwOhu3GX_xFFH6Z2fC&redirect_uri=https%3A%2F%2Fwww.megabox.co.kr%2Fon%2Foc%2Focz%2FSimpleLogin%2FnaverSimpleLoginCallBack.do&state=bt1eqp94nj5ou0mo5ho9jpbkut"
              class="naver"
              ><img src="ico-naver.png" alt=""
            /></a>
            <a
              href="https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=e3978f65019d0b71dff2adbcd8b84c70&redirect_uri=https%3A%2F%2Fwww.megabox.co.kr%2Fon%2Foc%2Focz%2FSimpleLogin%2FkakaoSimpleLoginCallBack.do&state=bt1eqp94nj5ou0mo5ho9jpbkut"
              class="kakao"
              ><img src="ico-kakao.png" alt=""
            /></a>
          </div>
        </div>
        <div class="loginR">
          <img class="login-img" src="login.png" alt="대체 이미지" />
        </div>
      </main>
    </section>
  </body>
</html>
