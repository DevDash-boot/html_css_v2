<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">Coupang</div>
      <div class="search-bar">
        <input type="text" placeholder="찾고 싶은 상품을 검색해보세요" />
        <button>검색</button>
      </div>
    </header>
    <main>
      <h2 class="section-title">오늘의 추천 상품</h2>
      <div class="product-grid">
        <div class="product-card">
          <span class="badge badge-rocket">로켓 배송</span>
          <span class="badge badge-sale">할인</span>
          <img src="https://picsum.photos/seed/prod10/250/250" alt="" />
          <h3>무선 블루투스 이어폰</h3>
          <p class="price-original">59,800원</p>
          <p class="price-sale">29,900원 <span class="discount">50%</span></p>
          <p class="rating">★★★★☆(128)</p>
          <p class="delivery">내일 도착</p>
        </div>
        <div class="product-card">
          <span class="badge badge-rocket">로켓 배송</span>
          <span class="badge badge-sale">할인</span>
          <img src="https://picsum.photos/seed/prod11/250/250" alt="" />
          <h3>스테인리스 텀블러</h3>
          <p class="price-original">25,000원</p>
          <p class="price-sale">15,900원 <span class="discount">36%</span></p>
          <p class="rating">★★★★★(256)</p>
          <p class="delivery">내일 도착</p>
        </div>
        <div class="product-card">
          <img src="https://picsum.photos/seed/prod12/250/250" alt="" />
          <h3>전자 시계</h3>
          <p class="price-sale">8,900원</p>
          <p class="rating">★★★★★(1307)</p>
          <p class="delivery">내일 도착</p>
        </div>
        <div class="product-card">
          <span class="badge badge-rocket">로켓 배송</span>
          <span class="badge badge-sale">할인</span>
          <img src="https://picsum.photos/seed/prod96/250/250" alt="" />
          <h3>여행</h3>
          <p class="price-original">1,275,000원</p>
          <p class="price-sale">1,007,250원 <span class="discount">21%</span></p>
          <p class="rating">★★★★★(13)</p>
          <p class="delivery">내일 도착</p>
        </div>
        <div class="product-card">
          <span class="badge badge-rocket">로켓 배송</span>
          <span class="badge badge-sale">할인</span>
          <img src="https://picsum.photos/seed/prod14/250/250" alt="" />
          <h3>카메라</h3>
          <p class="price-original">250,000원</p>
          <p class="price-sale">170,000원 <span class="discount">30%</span></p>
          <p class="rating">★★★★☆(329)</p>
          <p class="delivery">내일 도착</p>
        </div>
      </div>
    </main>
  </body>
</html>
