<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>레이아웃 7가지 패턴</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="content-wrapper">
      <!-- 패턴 1. 완전 가운데 정렬 -->
      <section class="demo-center">
        <div class="box">패턴 1. 완전 가운데 정렬</div>
      </section>

      <!-- 패턴 2. 네비게이션 바 -->
      <nav class="demo-nav">
        <span>Logo</span>
        <div>
          <a href="">메뉴1</a>
          <a href="">메뉴2</a>
          <a href="">메뉴3</a>
        </div>
      </nav>

      <!-- 패턴 3. 카드 그리드 -->
      <section class="demo-grid">
        <div class="card">카드1</div>
        <div class="card">카드2</div>
        <div class="card">카드3</div>
        <div class="card">카드4</div>
      </section>

      <!-- 패턴 4. 사이드바 + 메인 -->
      <div class="demo-sidebar-layout">
        <aside class="sidebar">사이드바</aside>
        <div class="content">메인 콘텐츠</div>
      </div>

      <!-- 패턴 5. 히어로 섹션 -->
      <section class="demo-hero">
        <h2>히어로 섹션</h2>
      </section>

      <!-- 패턴 7. 반응형 2단에서 1단으로 -->
      <div class="demo-responsive">
        <div class="col">왼쪽</div>
        <div class="col">오른쪽</div>
      </div>
    </div>

    <!-- 패턴 6. 스티키 푸터 -->
    <footer>ⓒ 2026 CSS Layout Patterns. All rights reserverd.</footer>
  </body>
</html>
